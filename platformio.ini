[platformio]
default_envs =
  standalone_rotary
  standalone_buttons
  standalone_preset
  standalone_diagnostic
  standalone_burnin
  web_dashboard
  web_mobile
  web_lab
  web_training
  web_burnin

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -D CORE_DEBUG_LEVEL=1

[standalone_base]
extends = env
build_flags =
  ${env.build_flags}
  -D APP_MODE=0

[web_base]
extends = env
build_flags =
  ${env.build_flags}
  -D APP_MODE=1

[env:standalone_rotary]
extends = standalone_base
build_flags = ${standalone_base.build_flags} -D VARIANT_ID=1

[env:standalone_buttons]
extends = standalone_base
build_flags = ${standalone_base.build_flags} -D VARIANT_ID=2

[env:standalone_preset]
extends = standalone_base
build_flags = ${standalone_base.build_flags} -D VARIANT_ID=3

[env:standalone_diagnostic]
extends = standalone_base
build_flags = ${standalone_base.build_flags} -D VARIANT_ID=4

[env:standalone_burnin]
extends = standalone_base
build_flags = ${standalone_base.build_flags} -D VARIANT_ID=5

[env:web_dashboard]
extends = web_base
build_flags = ${web_base.build_flags} -D VARIANT_ID=6

[env:web_mobile]
extends = web_base
build_flags = ${web_base.build_flags} -D VARIANT_ID=7

[env:web_lab]
extends = web_base
build_flags = ${web_base.build_flags} -D VARIANT_ID=8

[env:web_training]
extends = web_base
build_flags = ${web_base.build_flags} -D VARIANT_ID=9

[env:web_burnin]
extends = web_base
build_flags = ${web_base.build_flags} -D VARIANT_ID=10
