<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<style>text{font-family:Arial,sans-serif;fill:#152233}.title{font-size:28px;font-weight:bold}.h{font-size:19px;font-weight:bold}.t{font-size:15px}.box{fill:#eef6ff;stroke:#1769aa;stroke-width:2}.safe{fill:#effaf1;stroke:#238636;stroke-width:2}.warn{fill:#fff5e6;stroke:#d97706;stroke-width:2}.wire{stroke:#334155;stroke-width:3;fill:none}.red{stroke:#dc2626}.blue{stroke:#2563eb}.green{stroke:#16803c}.dash{stroke-dasharray:8 6}</style>
<rect width="1200" height="820" fill="white"/><text x="40" y="45" class="title">PUK ESP32 Standalone LCD — Wiring Overview v1.0.0</text>
<rect x="40" y="90" width="230" height="150" rx="12" class="warn"/><text x="60" y="120" class="h">12V Bench Power</text><text x="60" y="150" class="t">Fuse 2A</text><text x="60" y="175" class="t">Reverse polarity protection</text><text x="60" y="200" class="t">Buck 12V → 5V</text>
<rect x="420" y="80" width="330" height="430" rx="14" class="box"/><text x="475" y="115" class="h">ESP32 Dev Module (classic)</text>
<text x="445" y="155" class="t">GPIO21 SDA  ───────────────</text><text x="445" y="182" class="t">GPIO22 SCL  ───────────────</text><text x="445" y="225" class="t">GPIO25 MAP DAC ────────────</text><text x="445" y="252" class="t">GPIO26 TPS DAC ────────────</text><text x="445" y="295" class="t">GPIO18 CKP ────────────────</text><text x="445" y="322" class="t">GPIO19 CMP ────────────────</text><text x="445" y="365" class="t">GPIO32 START / GPIO33 MODE</text><text x="445" y="392" class="t">GPIO27 TEST</text><text x="445" y="425" class="t">GPIO36 RPM VR / GPIO39 LOAD VR</text><text x="445" y="468" class="t">GPIO16 RESP-A / GPIO17 RESP-B</text>
<path d="M270 165 H420" class="wire red"/><text x="300" y="154" class="t">5V → VIN</text><path d="M270 215 H370 V495 H420" class="wire"/><text x="292" y="235" class="t">Common GND*</text>
<rect x="820" y="80" width="330" height="135" rx="12" class="safe"/><text x="850" y="112" class="h">LCD 20×4 + I²C Level Shifter</text><text x="850" y="142" class="t">LV=3.3V / HV=5V</text><text x="850" y="168" class="t">GPIO21/22 must not see 5V pull-up</text><path d="M750 150 H820" class="wire blue"/><path d="M750 178 H820" class="wire blue"/>
<rect x="820" y="245" width="330" height="105" rx="12" class="safe"/><text x="850" y="278" class="h">Analog Sensor Outputs</text><text x="850" y="307" class="t">GPIO25/26 → 1kΩ → ECU input</text><text x="850" y="332" class="t">Range 0–3.3V; verify ECU requirement</text><path d="M750 225 H785 V285 H820" class="wire green"/><path d="M750 252 H785 V320 H820" class="wire green"/>
<rect x="820" y="385" width="330" height="115" rx="12" class="warn"/><text x="850" y="418" class="h">CKP/CMP Open Collector</text><text x="850" y="447" class="t">GPIO → 1kΩ → 2N2222 base</text><text x="850" y="473" class="t">Emitter GND; collector → ECU signal</text><path d="M750 295 H790 V425 H820" class="wire"/><path d="M750 322 H775 V465 H820" class="wire"/>
<rect x="820" y="545" width="330" height="125" rx="12" class="warn"/><text x="850" y="578" class="h">ECU Response Inputs</text><text x="850" y="607" class="t">ECU signal → protected PC817 input</text><text x="850" y="633" class="t">Collector → GPIO16/17; emitter GND</text><text x="850" y="657" class="t">Never connect injector/IGT directly</text><path d="M750 468 H785 V605 H820" class="wire dash"/>
<rect x="40" y="300" width="300" height="205" rx="12" class="box"/><text x="65" y="333" class="h">Local Controls</text><text x="65" y="365" class="t">GPIO32 — START/STOP button → GND</text><text x="65" y="395" class="t">GPIO33 — MODE button → GND</text><text x="65" y="425" class="t">GPIO27 — TEST button → GND</text><text x="65" y="455" class="t">GPIO36 — RPM 10k potentiometer</text><text x="65" y="485" class="t">GPIO39 — LOAD 10k potentiometer</text><path d="M340 400 H420" class="wire"/>
<rect x="40" y="560" width="710" height="170" rx="12" class="warn"/><text x="65" y="595" class="h">Safety Gate Before ECU Connection</text><text x="65" y="628" class="t">Confirm authoritative pinout, voltage domains, grounds, pull-ups, connector orientation, fuse/current limit,</text><text x="65" y="657" class="t">boot-state outputs and emergency power-off. Generic 36-1 is not an ECU-specific verified profile.</text><text x="65" y="690" class="t">*Common ground only after the bench ground scheme is confirmed. Use a current-limited supply.</text>
</svg>
