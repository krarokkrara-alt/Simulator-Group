<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <style>
      .bg{fill:#f5f7fa}.panel{fill:#fff;stroke:#263238;stroke-width:3}.title{font:700 34px Arial;fill:#102027}.h{font:700 23px Arial;fill:#0d47a1}.t{font:18px Arial;fill:#263238}.s{font:15px Arial;fill:#37474f}.warn{font:700 16px Arial;fill:#b71c1c}.wire{fill:none;stroke:#263238;stroke-width:4}.sig{fill:none;stroke:#1565c0;stroke-width:5}.power{fill:none;stroke:#c62828;stroke-width:5}.ground{fill:none;stroke:#2e7d32;stroke-width:5}.part{fill:#e3f2fd;stroke:#263238;stroke-width:3}.ecu{fill:#fff3e0;stroke:#e65100;stroke-width:3}.esp{fill:#e8f5e9;stroke:#2e7d32;stroke-width:3}.node{fill:#263238}.dash{fill:none;stroke:#607d8b;stroke-width:3;stroke-dasharray:10 8}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1200"/>
  <text class="title" x="800" y="52" text-anchor="middle">ESP32 Stand-Alone ECU Sensor Interface — 12 V Bench Simulator</text>
  <text class="warn" x="800" y="82" text-anchor="middle">BENCH USE ONLY • Verify ECU pinout and sensor specifications • Never connect ESP32 GPIO directly to an ECU</text>

  <!-- Power rail -->
  <rect class="panel" x="45" y="105" width="1510" height="145" rx="12"/>
  <text class="h" x="70" y="140">POWER &amp; PROTECTION</text>
  <rect class="part" x="75" y="165" width="155" height="50" rx="6"/><text class="t" x="152" y="197" text-anchor="middle">12 V Bench PSU</text>
  <path class="power" d="M230 190 H295"/><text class="s" x="263" y="180" text-anchor="middle">F1 1 A</text>
  <rect class="part" x="295" y="165" width="205" height="50" rx="6"/><text class="t" x="397" y="187" text-anchor="middle">Reverse polarity</text><text class="s" x="397" y="207" text-anchor="middle">P-MOSFET</text>
  <path class="power" d="M500 190 H565"/>
  <rect class="part" x="565" y="165" width="180" height="50" rx="6"/><text class="t" x="655" y="187" text-anchor="middle">SMBJ18A TVS</text><text class="s" x="655" y="207" text-anchor="middle">to ground</text>
  <path class="power" d="M745 190 H825"/>
  <rect class="part" x="825" y="145" width="220" height="40" rx="6"/><text class="t" x="935" y="172" text-anchor="middle">5 V buck regulator</text>
  <rect class="part" x="825" y="195" width="220" height="40" rx="6"/><text class="t" x="935" y="222" text-anchor="middle">Isolated ±12 V DC/DC</text>
  <path class="power" d="M1045 165 H1180"/><text class="s" x="1110" y="153">+5V interface</text>
  <path class="power" d="M1045 215 H1180"/><text class="s" x="1110" y="237">±12V analog</text>
  <rect class="esp" x="1180" y="145" width="160" height="90" rx="8"/><text class="t" x="1260" y="183" text-anchor="middle">ESP32</text><text class="s" x="1260" y="207" text-anchor="middle">3.3 V logic</text>
  <rect class="ecu" x="1370" y="145" width="150" height="90" rx="8"/><text class="t" x="1445" y="183" text-anchor="middle">ECU</text><text class="s" x="1445" y="207" text-anchor="middle">Sensor inputs</text>

  <!-- Hall -->
  <rect class="panel" x="45" y="275" width="740" height="390" rx="12"/>
  <text class="h" x="70" y="315">A — HALL / OPEN-COLLECTOR (CKP, CMP, VSS)</text>
  <rect class="esp" x="80" y="365" width="150" height="75" rx="8"/><text class="t" x="155" y="395" text-anchor="middle">ESP GPIO</text><text class="s" x="155" y="420" text-anchor="middle">3.3 V pulse</text>
  <path class="sig" d="M230 402 H310" marker-end="url(#arrow)"/><text class="s" x="270" y="388" text-anchor="middle">R1 2.2k</text>
  <circle class="node" cx="330" cy="402" r="6"/><text class="t" x="348" y="409">B</text>
  <path class="wire" d="M330 402 L385 365 M385 365 V330 M385 365 V495"/>
  <text class="t" x="405" y="370">Q1 MMBT3904</text><text class="s" x="405" y="392">40 V NPN</text>
  <path class="wire" d="M385 330 H485"/><text class="s" x="435" y="318" text-anchor="middle">Collector</text>
  <path class="sig" d="M485 330 H615" marker-end="url(#arrow)"/><text class="s" x="550" y="315" text-anchor="middle">R3 220Ω</text>
  <rect class="ecu" x="615" y="290" width="135" height="80" rx="8"/><text class="t" x="682" y="322" text-anchor="middle">ECU Hall</text><text class="s" x="682" y="347" text-anchor="middle">signal input</text>
  <path class="wire" d="M682 370 V430 H550"/><rect class="part" x="470" y="410" width="80" height="40" rx="5"/><text class="s" x="510" y="435" text-anchor="middle">10k*</text><path class="power" d="M470 430 H430 V385"/><text class="s" x="450" y="470">*Only if ECU has no pull-up</text>
  <path class="ground" d="M385 495 V555 H680 V515"/><text class="s" x="505" y="580">SENSOR GND (star point)</text>
  <rect class="ecu" x="615" y="465" width="135" height="70" rx="8"/><text class="t" x="682" y="495" text-anchor="middle">ECU sensor</text><text class="s" x="682" y="518" text-anchor="middle">ground</text>
  <path class="wire" d="M330 402 V485 H290"/><rect class="part" x="210" y="465" width="80" height="40" rx="5"/><text class="s" x="250" y="490" text-anchor="middle">R2 47k</text><path class="wire" d="M210 485 H185 V555 H385"/>
  <text class="warn" x="75" y="620">Output is inverted; use firmware polarity control.</text>
  <text class="warn" x="75" y="645">Do not fit an external pull-up until the ECU pull-up voltage is measured.</text>

  <!-- VR -->
  <rect class="panel" x="815" y="275" width="740" height="390" rx="12"/>
  <text class="h" x="840" y="315">B — MAGNETIC VR (BIPOLAR DIFFERENTIAL)</text>
  <rect class="esp" x="845" y="365" width="135" height="75" rx="8"/><text class="t" x="912" y="395" text-anchor="middle">ESP32 SPI</text><text class="s" x="912" y="420" text-anchor="middle">sample stream</text>
  <path class="sig" d="M980 402 H1040" marker-end="url(#arrow)"/>
  <rect class="part" x="1040" y="360" width="145" height="85" rx="8"/><text class="t" x="1112" y="393" text-anchor="middle">MCP4922</text><text class="s" x="1112" y="418" text-anchor="middle">12-bit SPI DAC</text>
  <path class="sig" d="M1185 402 H1245" marker-end="url(#arrow)"/><text class="s" x="1215" y="388" text-anchor="middle">0–5 V</text>
  <rect class="part" x="1245" y="335" width="180" height="135" rx="8"/><text class="t" x="1335" y="370" text-anchor="middle">OPA2197</text><text class="s" x="1335" y="397" text-anchor="middle">±12 V supply</text><text class="s" x="1335" y="422" text-anchor="middle">2 × (DAC − 2.5 V)</text><text class="s" x="1335" y="447" text-anchor="middle">complementary outputs</text>
  <path class="sig" d="M1425 370 H1485"/><text class="s" x="1455" y="355" text-anchor="middle">100Ω</text><circle class="node" cx="1490" cy="370" r="6"/><text class="t" x="1510" y="377">VR+</text>
  <path class="sig" d="M1425 435 H1485"/><text class="s" x="1455" y="462" text-anchor="middle">100Ω</text><circle class="node" cx="1490" cy="435" r="6"/><text class="t" x="1510" y="442">VR−</text>
  <path class="dash" d="M1490 370 V435"/><text class="s" x="1455" y="410" text-anchor="end">10k optional</text>
  <path class="power" d="M1335 335 V300"/><text class="s" x="1350" y="303">isolated ±12 V</text>
  <path class="sig" d="M925 520 C980 470 1030 570 1085 520 S1190 470 1245 520 S1350 570 1410 520"/>
  <line class="dash" x1="900" y1="520" x2="1440" y2="520"/><text class="s" x="1170" y="590" text-anchor="middle">Start at 0.5–1.0 V peak differential; verify zero crossings and maximum amplitude on an oscilloscope.</text>
  <text class="warn" x="845" y="635">VR is not 0/3.3 V logic. Never connect GPIO directly to VR+/VR−.</text>

  <!-- Analog -->
  <rect class="panel" x="45" y="690" width="740" height="440" rx="12"/>
  <text class="h" x="70" y="730">C — ANALOG 0–5 V (TPS, MAP, MAF, NARROWBAND O2)</text>
  <rect class="esp" x="80" y="795" width="135" height="75" rx="8"/><text class="t" x="147" y="825" text-anchor="middle">ESP32 SPI</text><text class="s" x="147" y="850" text-anchor="middle">target value</text>
  <path class="sig" d="M215 832 H280" marker-end="url(#arrow)"/>
  <rect class="part" x="280" y="785" width="145" height="95" rx="8"/><text class="t" x="352" y="820" text-anchor="middle">MCP4922</text><text class="s" x="352" y="845" text-anchor="middle">2 channels/chip</text><text class="s" x="352" y="865" text-anchor="middle">5.000 V reference</text>
  <path class="sig" d="M425 832 H480" marker-end="url(#arrow)"/>
  <polygon class="part" points="480,785 480,880 585,832"/><text class="s" x="515" y="825">OPA197</text><text class="s" x="510" y="847">buffer</text>
  <path class="sig" d="M585 832 H650"/><text class="s" x="618" y="818" text-anchor="middle">1k</text>
  <rect class="ecu" x="650" y="790" width="105" height="85" rx="8"/><text class="t" x="702" y="823" text-anchor="middle">ECU</text><text class="s" x="702" y="848" text-anchor="middle">analog input</text>
  <path class="ground" d="M535 880 V945 H702 V875"/><text class="s" x="600" y="970" text-anchor="middle">ECU SENSOR GND</text>
  <text class="t" x="90" y="1015">Recommended ranges</text>
  <text class="s" x="100" y="1045">TPS / MAP / analog MAF: 0.5–4.5 V</text>
  <text class="s" x="100" y="1070">Narrowband O2: 0.1–0.9 V</text>
  <text class="warn" x="100" y="1100">Wideband O2 requires a dedicated pump-cell/controller emulator.</text>

  <!-- Resistance -->
  <rect class="panel" x="815" y="690" width="740" height="440" rx="12"/>
  <text class="h" x="840" y="730">D — ECT / IAT RESISTANCE EMULATOR</text>
  <rect class="ecu" x="850" y="785" width="150" height="80" rx="8"/><text class="t" x="925" y="817" text-anchor="middle">ECU TEMP</text><text class="s" x="925" y="842" text-anchor="middle">input + pull-up</text>
  <path class="sig" d="M1000 825 H1070"/><circle class="node" cx="1070" cy="825" r="7"/>
  <g class="s">
    <path class="wire" d="M1070 825 V775 H1150"/><rect class="part" x="1150" y="755" width="125" height="40" rx="5"/><text x="1212" y="780" text-anchor="middle">PhotoMOS + 100Ω</text><path class="wire" d="M1275 775 H1390"/>
    <path class="wire" d="M1070 825 V825 H1150"/><rect class="part" x="1150" y="805" width="125" height="40" rx="5"/><text x="1212" y="830" text-anchor="middle">PhotoMOS + 470Ω</text><path class="wire" d="M1275 825 H1390"/>
    <path class="wire" d="M1070 825 V875 H1150"/><rect class="part" x="1150" y="855" width="125" height="40" rx="5"/><text x="1212" y="880" text-anchor="middle">PhotoMOS + 2.2k</text><path class="wire" d="M1275 875 H1390"/>
    <path class="wire" d="M1070 825 V925 H1150"/><rect class="part" x="1150" y="905" width="125" height="40" rx="5"/><text x="1212" y="930" text-anchor="middle">... up to 47k</text><path class="wire" d="M1275 925 H1390"/>
  </g>
  <path class="ground" d="M1390 755 V995 H1490"/><rect class="ecu" x="1390" y="980" width="130" height="70" rx="8"/><text class="t" x="1455" y="1010" text-anchor="middle">ECU sensor</text><text class="s" x="1455" y="1032" text-anchor="middle">ground</text>
  <rect class="esp" x="850" y="930" width="175" height="70" rx="8"/><text class="t" x="937" y="960" text-anchor="middle">ESP GPIO bank</text><text class="s" x="937" y="983" text-anchor="middle">break-before-make</text>
  <path class="sig" d="M1025 965 H1110" marker-end="url(#arrow)"/><text class="s" x="1067" y="950" text-anchor="middle">5 V LED drivers</text>
  <text class="warn" x="850" y="1095">Select one calibrated resistor at a time. Use the exact NTC resistance/temperature table.</text>

  <text class="s" x="800" y="1170" text-anchor="middle">Always test into dummy loads and an oscilloscope before connecting an ECU. Use separate keyed connectors for Hall, VR, analog and resistance outputs.</text>
</svg>
